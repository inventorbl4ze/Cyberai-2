
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050b19">
<title>CYBERAI 2.0 - Intelligent AI Assistant</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #050b19;
  color: #eaf5ff;
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

header {
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  border-bottom: 1px solid #12365b;
  background: #071326;
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo {
  color: #22baff;
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 2px;
  text-shadow: 0 0 15px #008cff;
}

button, label {
  cursor: pointer;
}

header button {
  background: #102b49;
  color: #7bd8ff;
  border: 1px solid #1478b9;
  padding: 10px 14px;
  border-radius: 9px;
}

main {
  max-width: 950px;
  margin: auto;
  padding: 20px;
}

#welcome {
  text-align: center;
  padding: 65px 10px 30px;
}

.orb {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  margin: 0 auto 25px;
  background: radial-gradient(circle, #4ce2ff, #0755a5, #071326);
  box-shadow: 0 0 35px #008cff;
}

#welcome h1 {
  font-size: 30px;
  color: #35caff;
  margin-bottom: 12px;
}

#welcome p {
  color: #a7c7e6;
  line-height: 1.6;
}

.suggestions {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-top: 28px;
}

.suggestions button {
  padding: 15px;
  border: 1px solid #14517c;
  border-radius: 12px;
  background: #0a1c32;
  color: #c8eaff;
  text-align: left;
}

#chat {
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding-bottom: 20px;
}

.message {
  max-width: 90%;
  padding: 15px;
  border-radius: 15px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  align-self: flex-end;
  background: #104d80;
  border: 1px solid #1688d0;
}

.assistant {
  align-self: flex-start;
  background: #0c1c30;
  border: 1px solid #17456b;
}

.copy-button {
  display: block;
  margin-top: 10px;
  background: transparent;
  border: 1px solid #247bb1;
  color: #80d9ff;
  padding: 6px 10px;
  border-radius: 7px;
}

.composer {
  position: sticky;
  bottom: 0;
  background: #050b19;
  padding: 12px 0 18px;
  border-top: 1px solid #12365b;
}

.input-area {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  background: #0a1b30;
  border: 1px solid #17629b;
  border-radius: 15px;
  padding: 10px;
}

textarea {
  flex: 1;
  min-width: 0;
  min-height: 45px;
  max-height: 150px;
  resize: vertical;
  background: transparent;
  color: white;
  border: none;
  outline: none;
  font-size: 16px;
  padding: 10px 5px;
}

.input-area button {
  background: #087fc5;
  color: white;
  border: none;
  border-radius: 10px;
  padding: 12px;
}

.tools {
  display: flex;
  gap: 12px;
  margin-top: 10px;
}

.tools button, .tools label {
  background: #10233b;
  color: #85d7ff;
  border: 1px solid #174c76;
  padding: 9px 13px;
  border-radius: 8px;
}

#fileInput {
  display: none;
}

#uploadPreview {
  font-size: 12px;
  color: #9edfff;
  margin-top: 8px;
}

#status {
  font-size: 12px;
  color: #83cfff;
  padding: 5px;
}

footer {
  text-align: center;
  padding: 22px;
  color: #7194b3;
  font-size: 12px;
}

@media(max-width: 550px) {
  main { padding: 12px; }
  #welcome { padding-top: 45px; }
  #welcome h1 { font-size: 25px; }
  .suggestions { grid-template-columns: 1fr; }
  .message { max-width: 96%; }
}
</style>
</head>

<body>

<header>
  <div class="logo">CYBERAI 2.0</div>
  <button onclick="newChat()">+ New Chat</button>
</header>

<main>

<section id="welcome">
  <div class="orb"></div>
  <h1>Welcome to CYBERAI 2.0</h1>
  <p>
    Your intelligent AI assistant.<br>
    Ask questions, explore ideas, learn and create.
  </p>

  <div class="suggestions">
    <button onclick="suggest('Explain artificial intelligence in simple terms.')">
      Explain artificial intelligence
    </button>
    <button onclick="suggest('Teach me something interesting about technology.')">
      Explore technology
    </button>
    <button onclick="suggest('Help me write a creative story.')">
      Write a creative story
    </button>
    <button onclick="suggest('Give me ideas for a new business.')">
      Discover business ideas
    </button>
  </div>
</section>

<section id="chat"></section>

<div class="composer">
  <div class="input-area">
    <textarea id="prompt" placeholder="Ask CYBERAI anything..."></textarea>
    <button onclick="sendMessage()" id="sendButton">Send</button>
  </div>

  <div class="tools">
    <button onclick="startVoice()">🎤 Voice</button>
    <label for="fileInput">📎 Attach</label>
    <input type="file" id="fileInput"
      accept=".txt,.pdf,.doc,.docx,image/*" multiple>
  </div>

  <div id="uploadPreview"></div>
  <div id="status">CYBERAI is ready.</div>
</div>

</main>

<footer>
  CYBERAI 2.0<br>
  Created by Oduyebo Abiola
</footer>

<script>
const API_URL =
"https://cyberai-engine.anuoluwapooduyebo01.workers.dev/";

const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");
const promptBox = document.getElementById("prompt");
const fileInput = document.getElementById("fileInput");
const uploadPreview = document.getElementById("uploadPreview");
const statusText = document.getElementById("status");
const sendButton = document.getElementById("sendButton");

let current = [];
let conversations = JSON.parse(
  localStorage.getItem("cyberai_history") || "[]"
);

function saveHistory() {
  localStorage.setItem(
    "cyberai_history",
    JSON.stringify(conversations)
  );
}

function saveConversation() {
  if (!current.length) return;

  const conversation = {
    id: current.id,
    title: current.find(m => m.role === "user").text.slice(0, 35),
    messages: current
  };

  const index = conversations.findIndex(
    c => c.id === conversation.id
  );

  if (index >= 0) {
    conversations[index] = conversation;
  } else {
    conversations.unshift(conversation);
  }

  conversations = conversations.slice(0, 30);
  saveHistory();
}

function renderMessage(text, role) {
  const wrapper = document.createElement("div");
  wrapper.className = "message " + role;

  const content = document.createElement("div");
  content.textContent = text;
  wrapper.appendChild(content);

  if (role === "assistant") {
    const copy = document.createElement("button");
    copy.className = "copy-button";
    copy.textContent = "Copy response";

    copy.onclick = async () => {
      try {
        await navigator.clipboard.writeText(text);
        copy.textContent = "Copied!";
      } catch {
        copy.textContent = "Copy unavailable";
      }
    };

    wrapper.appendChild(copy);
  }

  chat.appendChild(wrapper);
  chat.scrollTop = chat.scrollHeight;
}

/* REAL OPENAI CONNECTION */
async function sendMessage() {
  const text = promptBox.value.trim();
  const selectedFiles = Array.from(fileInput.files);

  if (!text && !selectedFiles.length) return;

  welcome.style.display = "none";

  let message = text;

  if (selectedFiles.length) {
    message += (message ? "\n" : "") +
      "Selected files (not uploaded for reading): " +
      selectedFiles.map(file => file.name).join(", ");
  }

  if (!current.id) current.id = Date.now();

  current.push({
    role: "user",
    text: message
  });

  renderMessage(message, "user");

  promptBox.value = "";
  fileInput.value = "";
  uploadPreview.innerHTML = "";

  sendButton.disabled = true;
  sendButton.textContent = "...";
  statusText.textContent = "CYBERAI is thinking...";

  const typing = document.createElement("div");
  typing.className = "message assistant";
  typing.textContent = "Connecting to CYBERAI...";
  chat.appendChild(typing);

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: text || message
      })
    });

    const data = await response.json();
    typing.remove();

    if (!response.ok) {
      throw new Error(data.error || "AI service error.");
    }

    const answer = data.reply || "No response received.";

    current.push({
      role: "assistant",
      text: answer
    });

    renderMessage(answer, "assistant");
    saveConversation();

    statusText.textContent = "CYBERAI is ready.";

  } catch (error) {
    typing.remove();

    renderMessage(
      "Connection error: " + error.message,
      "assistant"
    );

    statusText.textContent =
      "Connection problem. Please try again.";
  }

  sendButton.disabled = false;
  sendButton.textContent = "Send";
  chat.scrollTop = chat.scrollHeight;
}

function suggest(text) {
  promptBox.value = text;
  promptBox.focus();
}

function newChat() {
  current = [];
  current.id = Date.now();

  chat.innerHTML = "";
  welcome.style.display = "block";

  promptBox.value = "";
  fileInput.value = "";
  uploadPreview.innerHTML = "";

  statusText.textContent = "New conversation started.";
}

function startVoice() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Voice input is not supported in this browser.");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "en-US";
  recognition.interimResults = false;

  recognition.onresult = event => {
    promptBox.value += event.results[0][0].transcript;
    promptBox.focus();
  };

  recognition.onerror = () => {
    statusText.textContent = "Voice input unavailable.";
  };

  recognition.start();
}

fileInput.addEventListener("change", () => {
  uploadPreview.innerHTML = "";

  Array.from(fileInput.files).forEach(file => {
    const item = document.createElement("div");
    item.textContent = "📎 " + file.name;
    uploadPreview.appendChild(item);
  });
});

promptBox.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});
</script>

</body>
</html>
